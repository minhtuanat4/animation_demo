pluginManagement {
    def flutterSdkPath = null

    // ✅ Read the Flutter SDK path from local.properties
    def localProperties = new File(rootDir, "local.properties")
    if (localProperties.exists()) {
        localProperties.eachLine { line ->
            if (line.startsWith("flutter.sdk=")) {
                flutterSdkPath = line.split("=")[1].trim()
            }
        }
    }

    if (flutterSdkPath == null) {
        throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
    }

    // ✅ This line links Gradle to Flutter's plugin build
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.6.0" apply false
    id "com.android.library" version "8.6.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.25" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
    id "com.google.firebase.crashlytics" version "3.0.2" apply false
//    id "dev.flutter.flutter-gradle-plugin"
}

include(":app")